<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head><meta charset="UTF-8"><title>sw probe</title>
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}
#R{white-space:pre-wrap;padding:8px;background:#000}
iframe{width:1280px;height:800px;border:0;display:block}</style>
</head>
<body>
<pre id="R">pending</pre>
<iframe id="F" src="./"></iframe>
<script>
try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
var O=[];
function push(s){ O.push(s); document.getElementById('R').textContent='@@'+O.join('\n')+'@@'; }
var fin=false;
function finish(){ if(fin) return; fin=true; push('== SW SECTION DONE =='); }
window.addEventListener('load', function(){
  (async function(){
    push('navigator.onLine : '+(navigator.onLine?'true':'false'));
    push('this page URL    : '+location.href);
    if(!('serviceWorker' in navigator)){ push('NO serviceWorker support'); return; }
    try{
      var reg = await navigator.serviceWorker.ready;
      push('SW scope        : '+reg.scope);
      push('SW state        : '+(reg.active?reg.active.state:'none'));
      push('page controlled : '+!!navigator.serviceWorker.controller);
      push('cache names     : '+(await caches.keys()).join(','));
    }catch(e){ push('SW ERROR: '+e.message); finish(); return; }

    var n=0,names=[];
    for(var i=0;i<240;i++){
      try{ var c=await caches.open('bls-deck-v1'); var k=await c.keys(); n=k.length; if(n>=24) break; }catch(e){}
      await new Promise(function(r){ setTimeout(r,250); });
    }
    try{
      var c2=await caches.open('bls-deck-v1');
      names=(await c2.keys()).map(function(r){ return decodeURIComponent(r.url.split('/').pop())||'(root)'; }).sort();
    }catch(e){}
    push('cache entries   : '+n+' / 24 expected');
    names.forEach(function(x){ push('   cached: '+x); });
    finish();
  })();
});

function inspectDeck(){
  var fr=document.getElementById('F');
  var d,w;
  try{ d=fr.contentDocument; w=fr.contentWindow; }catch(e){ return false; }
  if(!d || !d.body || d.readyState!=='complete') return false;
  if(!d.querySelector('section')) return false;
  setTimeout(function(){
  try{
    push('');
    push('--- DECK in iframe (src="./") ---');
    var secs=d.querySelectorAll('section').length;
    push('sections        : '+secs);
    var imgs=[].slice.call(d.querySelectorAll('img'));
    var ok=imgs.filter(function(i){ return i.complete && i.naturalWidth>0; });
    push('photos loaded   : '+ok.length+'/'+imgs.length);
    imgs.forEach(function(im){
      push('   '+(im.complete&&im.naturalWidth>0?'ok  ':'FAIL')+' '+
           decodeURIComponent(im.getAttribute('src').split('/').pop())+'  '+
           im.naturalWidth+'x'+im.naturalHeight);
    });
    var broken=[].slice.call(d.querySelectorAll('img')).filter(function(i){ return i.dataset.tried; });
    push('imgErr fallbacks: '+broken.length);
    var ff=[].slice.call(d.fonts||[]);
    push('fonts total     : '+ff.length);
    push('font errors     : '+ff.filter(function(f){ return f.status==='error'; }).length);
    push('nastaliq 700 ok : '+d.fonts.check('700 20px "Noto Nastaliq Urdu"'));
    push('anton 400 ok    : '+d.fonts.check('400 20px "Anton"'));
    var h1=d.querySelector('h1');
    if(h1){
      var r=h1.getBoundingClientRect();
      push('H1 family       : '+w.getComputedStyle(h1).fontFamily.split(',')[0]);
      push('H1 size x height: '+w.getComputedStyle(h1).fontSize+' / '+r.height.toFixed(0)+'px');
      push('H1 text         : '+h1.textContent.trim().slice(0,40));
    }
    push('deck scrollH    : '+d.documentElement.scrollHeight+'px (viewport '+w.innerHeight+')');
    push('iframe doc chars: '+d.body.innerHTML.length);
  }catch(e){ push('IFRAME ERROR: '+e.message); }
  push('===END===');
  },3000);
  return true;
}
var tries=0;
(function poll(){
  if(tries++>300){ push(''); push('IFRAME NEVER BECAME INSPECTABLE'); push('===END==='); return; }
  if(inspectDeck()) return;
  setTimeout(poll,300);
})();

</script>
</body>
</html>
